[package]
name = "iceberg_rust_ffi"
version = "0.2.0"
edition = "2021"

[lib]
name = "iceberg_rust_ffi"
crate-type = ["cdylib"]

[features]
default = ["julia"]
julia = []

[dependencies]
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev = "3a9cb6b1868b5a2f2e3f86ba6a6a07ece34c252f" }
object_store_ffi = { git = "https://github.com/RelationalAI/object_store_ffi", rev = "db0f6a3fe282e267a53c119c0aca4b5af341df3f", default-features = false }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
libc = "0.2"
anyhow = "1.0"
arrow-array = "55.2.0"
arrow-ipc = "55.2.0"
tracing-subscriber = "0.3"
tracing = "0.1"
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.0"
